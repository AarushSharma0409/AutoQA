worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    resolver 127.0.0.11 valid=5s ipv6=off;
    limit_req_zone $binary_remote_addr zone=ingress:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=connections:10m;
    upstream api_pool {
        zone api_pool 64k;
        least_conn;
        server api:8000 resolve max_fails=2 fail_timeout=10s;
        keepalive 32;
    }
    upstream web_pool {
        zone web_pool 64k;
        server web:3000 resolve;
        keepalive 16;
    }
    server {
        listen 8080;
        limit_req zone=ingress burst=200 nodelay;
        limit_req_status 429;
        limit_conn connections 80;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        location /api/ {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 90s;
            proxy_next_upstream error timeout http_502 http_503;
        }
        location / {
            proxy_pass http://web_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
    server {
        listen 8081;
        limit_req zone=ingress burst=200 nodelay;
        limit_req_status 429;
        limit_conn connections 80;
        location / {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 90s;
        }
    }
}
