services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: autoagent
      POSTGRES_PASSWORD: autoagent
      POSTGRES_DB: autoagent
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoagent"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ["python", "-m", "app.db"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["artifacts:/app/data"]
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes: ["artifacts:/app/data"]
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ["python", "-m", "app.worker"]
    init: true
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_started}
    volumes: ["artifacts:/app/data"]
  sandbox:
    build: {context: ., dockerfile: backend/Dockerfile.broker}
    environment:
      SANDBOX_SECRET: ${SANDBOX_SECRET}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    # Trusted internal broker only; socket never enters API, worker or job container.
    profiles: ["live"]
  web:
    build: {context: ./frontend}
    environment:
      API_URL: http://api:8000
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [api]
volumes:
  postgres:
  redis:
  artifacts:
