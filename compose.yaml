services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: autoagent
      POSTGRES_PASSWORD: autoagent
      POSTGRES_DB: autoagent
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoagent"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ["python", "-m", "app.db"]
    depends_on:
      postgres: {condition: service_healthy}
    volumes: ["artifacts:/app/data"]
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    expose: ["8000"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes: ["artifacts:/app/data"]
  worker:
    build: {context: ., dockerfile: backend/Dockerfile}
    env_file: .env
    command: ["python", "-m", "app.worker"]
    init: true
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    volumes: ["artifacts:/app/data"]
  sandbox:
    build: {context: ., dockerfile: backend/Dockerfile.broker}
    environment:
      SANDBOX_SECRET: ${SANDBOX_SECRET}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    # Trusted internal broker only; socket never enters API, worker or job container.
    profiles: ["live"]
  web:
    build: {context: ./frontend}
    environment:
      API_URL: http://api:8000
    expose: ["3000"]
    restart: unless-stopped
    depends_on: [api]
  gateway:
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports: ["127.0.0.1:3000:8080", "127.0.0.1:8000:8081"]
    volumes: ["./deploy/nginx.conf:/etc/nginx/nginx.conf:ro"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 5s
      timeout: 4s
      retries: 10
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_started}
volumes:
  postgres:
  redis:
  artifacts:
